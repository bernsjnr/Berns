<body data-base="../" data-page="work" class="scroll work" data-work-view="cards">

<header class="bar">
  <p class="bar-name"><a href="../home/index.html"><span class="scale">Bernard <br>Bannor</span><span class="aka mono">(Also known as &lsquo;Berns&rsquo;)</span></a></p>
  <div class="bar-right">
    <time class="bar-clock mono" data-clock><span class="clock-date"></span><span class="clock-time"></span></time>
    <span class="bar-batt" data-battery role="img" aria-label="Battery">
      <svg viewBox="0 0 40 20" aria-hidden="true">
        <rect x="1" y="1" width="34" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
        <rect x="36.5" y="6.5" width="3" height="7" rx="1.2" fill="currentColor"/>
        <rect class="fill" x="4" y="4" width="28" height="12" rx="2.5" fill="currentColor"/>
        <path class="bolt" d="M19.5 3.5 13 11h5l-1.5 5.5L23 9h-5z" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
      </svg>
    </span>
    <button class="bar-menu scale" type="button" data-menu-btn aria-expanded="false" aria-controls="menu"><span class="lbl">Menu</span><span class="pm" aria-hidden="true"></span></button>
  </div>
</header>

<nav class="menu" id="menu" aria-label="Main">
  <ol>
    <li><a class="scale" href="../home/index.html"><span class="n mono">01</span><span class="t">Home</span></a></li>

  </ol>

<main class="work-main">
  <h1 class="sr">Work</h1>

  <!-- Filters (built in work.js) and the Cards / Folders switch -->
  <div class="work-top">
    <div class="work-filters">
      <div class="filters" data-filters role="group" aria-label="Filter by discipline"></div>
    </div>
    <div class="views mono" role="group" aria-label="View">
        <button type="button" class="chip mono" data-folder-chip hidden><span></span> &times;<span class="sr"> Clear folder</span></button>
      <button type="button" data-view="cards" aria-pressed="true">Cards</button>
      <button type="button" data-view="folders" aria-pressed="false">Folders</button>
    </div>
  </div>

  <!-- Swipe through the cards; the one in the middle plays and opens -->
  <section class="stage" data-stage aria-roledescription="carousel" aria-label="Projects">
    <div class="deck" data-deck></div>
    <div class="folders" data-folders></div>
  </section>

  <div class="work-cap" aria-live="polite">
    <button type="button" class="nav-arrow mono" data-prev aria-label="Previous project">&larr;</button>
    <div class="cap-text">
      <p class="cap-name" data-cap-name></p>
      <p class="cap-meta mono"><span data-cap-meta></span></p>
    </div>
    <div class="cap-side">
      <span class="cap-count mono" data-cap-count></span>
      <a class="cap-link mono" data-cap-link href="#"><span class="go">View project</span></a>
    </div>
    <button type="button" class="nav-arrow mono" data-next aria-label="Next project">&rarr;</button>
  </div>
</main>

<script src="../assets/data.js"></script>
<script src="../assets/core.js?v=47"></script>
<script src="../assets/work.js?v=39"></script>
</body>
</html>
