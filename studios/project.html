<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>Project. Berns Studios</title>
<meta name="description" content="A Berns Studios project.">
<!-- Adobe Fonts kit (Scale variable + Neue Haas Grotesk). Loads anywhere, no domain setup. -->
<link rel="stylesheet" href="https://use.typekit.net/tdx4jgk.css">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body data-base="../" data-page="studios">
<main>
<section class="p-detail">
  <aside class="p-info">
    <a class="label rv" href="index.html">Work</a>
    <h1 class="p-title rv" id="p-name"></h1>
    <div class="p-meta rv" id="p-meta"></div>
    <div class="prose rv" id="p-about"></div>
  </aside>
  <div class="media rv" id="p-media"></div>
</section>
<a class="p-next" id="p-next"><span class="label">Next project</span><span class="split-title" id="p-next-name"></span></a>
<section class="contact">
  <p class="label rv">Contact</p>
  <h2 class="big rv">Let's make something you're proud of.</h2>
  <a class="mail rv" href="mailto:info@bernsds.com">info@bernsds.com</a>
  <div class="actions rv">
    <a class="btn" href="mailto:info@bernsds.com?subject=Studio%20enquiry">Studio enquiry</a>
    <a class="btn line" href="mailto:info@bernsds.com?subject=Presenting%20booking">Presenting booking</a>
  </div>
  <div class="mark rv" data-logo></div>
</section>
</main>
<script src="../assets/data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="../assets/site.js"></script>
<script>
(() => {
  const D = BERNS, U = BERNS_UI;
  const id = new URLSearchParams(location.search).get('p');
  const i = Math.max(0, D.projects.findIndex(p => p.id === id));
  const p = D.projects[i];
  document.title = p.name + '. Berns Studios';
  document.getElementById('p-name').textContent = p.name;
  document.getElementById('p-meta').innerHTML = [['Client', p.client], ['Discipline', p.discipline], ['Year', p.year]]
    .map(([k, v]) => `<div><span class="label">${k}</span><span>${v || '–'}</span></div>`).join('');
  document.getElementById('p-media').innerHTML = U.media(p);
  document.getElementById('p-about').innerHTML = p.about ? p.about.split('\n\n').map(t => t.split('\n').map(l => l.startsWith('## ') ? `<h3>${l.slice(3)}</h3>` : `<p>${l}</p>`).join('')).join('') : '<p>Write-up to come.</p>';
  const next = D.projects[(i + 1) % D.projects.length];
  document.getElementById('p-next').href = 'project.html?p=' + next.id;
  document.getElementById('p-next-name').textContent = next.name;
  U.observe();
})();
</script>
</body>
</html>
