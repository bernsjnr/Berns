/* The project's colour, set before the first paint so the page opens in it */
(() => {
  const P = BERNS.projects, id = new URLSearchParams(location.search).get('p');
  const p = P.find(x => x.id === id) || P[0];
  const r = document.documentElement.style;
  r.setProperty('--p-bg', p.bg);
  r.setProperty('--p-fg', p.fg || BERNS.fgOn(p.bg));
  document.querySelector('meta[name="theme-color"]').content = p.bg;
  window.BERNS_CASE = p;
  /* Start fetching the opener's still now, not after the page is built */
  if (!p.cover && p.video) {
    const l = document.createElement('link'); l.rel = 'preload'; l.as = 'image'; l.href = '../' + p.poster; document.head.appendChild(l);
  }
})();
</script>
