<script>
/* Phones: the wordmark is exactly as wide as the CONTACT label above it */
(() => {
  const wm = document.querySelector('.ct-wm'), lb = document.querySelector('.ct-label');
  const fit = () => {
    wm.style.fontSize = '';
    if (innerWidth > 760) return;
    const f = parseFloat(getComputedStyle(wm).fontSize);
    wm.style.fontSize = (f * lb.offsetWidth / wm.offsetWidth).toFixed(2) + 'px';
  };
  fit(); addEventListener('resize', fit);
  if (document.fonts) document.fonts.ready.then(fit);
})();
</script>
